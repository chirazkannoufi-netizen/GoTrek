name: gotrek_app
description: "GoTrek — a tourism services app for discovering destinations, booking stays and managing trips."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local persistence for the session and saved places
  shared_preferences: ^2.5.2

  # Currency and date formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Registers every file in the directory, including the destination
    # photographs (london_explore.jpg, rome_explore.jpg, istanbul_explore.jpg,
    # dubai_explore.jpg, bangkok_explore.jpg, barcelona_explore.jpg).
    - assets/images/

  fonts:
    # Used only for the welcome tagline. Bundled rather than fetched at
    # runtime so it renders identically offline. SIL OFL 1.1 — licence in
    # assets/fonts/OFL.txt.
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
